name: bank-exchange-rate-service

services:
  exchange-rate-app:
    image: ${EXCHANGE_RATE_IMAGE:-bank-exchange-rate-service:local}
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      GRPC_PORT: "55053"
      GRPC_NETWORK: tcp
      MONOBANK_BASE_URL: ${MONOBANK_BASE_URL:-https://api.monobank.ua}
      MONOBANK_CURRENCY_ENDPOINT: ${MONOBANK_CURRENCY_ENDPOINT:-/bank/currency}
      MONOBANK_REFRESH_INTERVAL: ${MONOBANK_REFRESH_INTERVAL:-5m}
      KAFKA_BROKERS: exchange-rate-kafka:19094
      GET_RELATIVE_RANKING_REQUEST_TOPIC: ${GET_RELATIVE_RANKING_REQUEST_TOPIC:-exchange-rate.get-relative-ranking.request}
      GET_ALL_RANKING_REQUEST_TOPIC: ${GET_ALL_RANKING_REQUEST_TOPIC:-exchange-rate.get-all-ranking.request}
      REDIS_ADDR: exchange-rate-redis:16379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-2}
    depends_on:
      exchange-rate-kafka:
        condition: service_healthy
      exchange-rate-redis:
        condition: service_healthy
    ports:
      - "${GRPC_HOST_PORT:-55053}:55053"
    healthcheck:
      test: ["CMD", "/app/bank-exchange-rate-service", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - exchange-rate-network

  exchange-rate-kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19094,EXTERNAL://:39092,CONTROLLER://:19095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://exchange-rate-kafka:19094,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_HOST_PORT:-39092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@exchange-rate-kafka:19095
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-39092}:39092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19094", "--list"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    volumes:
      - exchange-rate-kafka-data:/var/lib/kafka/data
    networks:
      - exchange-rate-network

  exchange-rate-redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--port", "16379", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-16380}:16379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - exchange-rate-redis-data:/data
    networks:
      - exchange-rate-network

volumes:
  exchange-rate-kafka-data:
    name: bank-exchange-rate-kafka-data
  exchange-rate-redis-data:
    name: bank-exchange-rate-redis-data

networks:
  exchange-rate-network:
    name: bank-exchange-rate-network
    driver: bridge
