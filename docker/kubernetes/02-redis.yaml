apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exchange-rate-redis-data
  namespace: bank
  labels:
    app.kubernetes.io/name: exchange-rate-redis
    app.kubernetes.io/part-of: bank
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-rate-redis
  namespace: bank
  labels:
    app.kubernetes.io/name: exchange-rate-redis
    app.kubernetes.io/part-of: bank
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: exchange-rate-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exchange-rate-redis
        app.kubernetes.io/part-of: bank
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: exchange-rate-redis-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: exchange-rate-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: exchange-rate-redis
  namespace: bank
  labels:
    app.kubernetes.io/name: exchange-rate-redis
    app.kubernetes.io/part-of: bank
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: exchange-rate-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
